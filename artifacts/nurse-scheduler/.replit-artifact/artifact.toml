kind = "web"
previewPath = "/"
title = "간호사 스케줄 관리"
version = "1.0.0"
id = "artifacts/nurse-scheduler"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24675

[services.development]
run = "pnpm --filter @workspace/nurse-scheduler run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nurse-scheduler", "run", "build" ]
publicDir = "artifacts/nurse-scheduler/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24675"
BASE_PATH = "/"
